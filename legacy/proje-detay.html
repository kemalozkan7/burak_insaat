<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proje Detayı — Burak İnşaat</title>
  <link rel="icon" type="image/png" href="assets/img/logo-mark.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="projects">

  <header id="site-header"></header>

  <section class="section" style="padding-top:2rem">
    <div class="container">
      <div class="crumbs" style="color:var(--muted)"><a href="index.html">Ana Sayfa</a><span><a href="projeler.html">Projeler</a></span><span id="crumb"></span></div>

      <div class="detail" id="detail"></div>
    </div>
  </section>

  <section class="section section--cream">
    <div class="container">
      <div class="section-head">
        <div><span class="eyebrow">Konum</span><h2>Proje Lokasyonu</h2></div>
        <a class="link" id="mapLink" href="#" target="_blank" rel="noopener">Google Haritalar'da aç <i data-icon="arrow"></i></a>
      </div>
      <div class="map"><iframe id="map" loading="lazy" referrerpolicy="no-referrer-when-downgrade" title="Harita"></iframe></div>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div class="section-head">
        <div><span class="eyebrow">Diğer Projeler</span><h2>İlginizi çekebilir</h2></div>
        <a class="link" href="projeler.html">Tümünü gör <i data-icon="arrow"></i></a>
      </div>
      <div class="grid grid--3" id="related"></div>
    </div>
  </section>

  <footer id="site-footer"></footer>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/main.js"></script>
  <script>
    BI.onPage = function ({ $, $$, icon }) {
      const id = new URLSearchParams(location.search).get("id");
      const p = BI.projects.find(x => x.id === id) || BI.projects[0];
      document.title = `${p.title} — Burak İnşaat`;
      $("#crumb").textContent = p.title;

      const phases = ["Temel", "Kaba İnşaat", "Cephe & Çatı", "İnce İşler", "Teslim"];
      const phaseIdx = Math.min(4, Math.floor(p.progress / 20));
      const progressBlock = p.status === "ongoing" ? `
        <div class="progress-card">
          <div class="site-card__head"><span class="dot"></span> Şantiye ilerleme raporu</div>
          <div class="progress"><span style="width:${p.progress}%"></span></div>
          <div class="progress__meta"><span>Planlanan teslim: <strong>${p.delivery}</strong></span><strong>%${p.progress} tamamlandı</strong></div>
          <div class="phase-list">${phases.map((ph, i) => `<div class="phase ${i < phaseIdx ? "done" : i === phaseIdx ? "done now" : ""}"><i></i>${ph}</div>`).join("")}</div>
        </div>` : "";

      $("#detail").innerHTML = `
        <div>
          <div class="gallery">
            <div class="gallery__main">
              <img id="mainImg" src="${p.gallery[0]}" alt="${p.title}">
              <span class="badge badge--${p.status}">${BI.statusLabels[p.status]}</span>
              <span class="gallery__count">${icon("camera")} ${p.gallery.length} fotoğraf</span>
            </div>
            <div class="gallery__thumbs">${p.gallery.map((g, i) => `<button class="${i ? "" : "active"}" data-src="${g}"><img src="${g}" alt=""></button>`).join("")}</div>
          </div>

          <div class="detail__title">
            <div>
              <span class="card__loc">${icon("pin")} ${p.location} · ${BI.typeLabels[p.type]}</span>
              <h1>${p.title}</h1>
              <span class="muted" style="font-size:.85rem">Proje kodu: ${p.code}</span>
            </div>
            <div class="detail__price"><strong>${BI.fmtPrice(p.price)}</strong><span>${p.price ? "başlangıç fiyatı" : "detaylı fiyat listesi için iletişime geçin"}</span></div>
          </div>

          <div class="spec-grid">
            <div class="spec">${icon("bed")}<div><small>Oda</small><strong>${p.rooms}</strong></div></div>
            <div class="spec">${icon("area")}<div><small>Alan</small><strong>${p.area.toLocaleString("tr-TR")} m²</strong></div></div>
            <div class="spec">${icon("layers")}<div><small>Kat</small><strong>${p.floors}</strong></div></div>
            <div class="spec">${icon("building")}<div><small>Bağımsız Bölüm</small><strong>${p.units}</strong></div></div>
          </div>

          ${progressBlock}

          <h2>Proje Hakkında</h2>
          <p class="detail__text">${p.summary}</p>
          <p class="detail__text">Projede A sınıfı yapı malzemeleri, deprem yönetmeliğine tam uyumlu statik tasarım ve enerji verimli cephe sistemi kullanılmaktadır. Tüm bağımsız bölümler 2 yıl işçilik garantisi ile teslim edilir; teslim sonrasında satış sonrası ekibimiz kiralama ve mülk yönetimi konusunda destek sunar.</p>

          <h2>Özellikler</h2>
          <ul class="amenities">${p.features.map(f => `<li>${icon("check")} ${f}</li>`).join("")}</ul>
        </div>

        <aside class="sidebar">
          <div class="panel">
            <div class="agent">
              <img src="${BI.team[0].img}" alt="${BI.team[0].name}">
              <div><strong>${BI.team[0].name}</strong><span>Satış Danışmanı · ${BI.company.phone}</span></div>
            </div>
            <h3>Bilgi & Randevu Talebi</h3>
            <form data-form="project">
              <input type="hidden" name="project" value="${p.title}">
              <div class="field"><input name="name" required placeholder="Ad Soyad"></div>
              <div class="field"><input name="phone" type="tel" required placeholder="Telefon"></div>
              <div class="field"><input name="email" type="email" placeholder="E-posta"></div>
              <div class="field"><textarea name="msg" style="min-height:90px" placeholder="${p.title} hakkında bilgi almak istiyorum."></textarea></div>
              <label class="consent"><input type="checkbox" required> KVKK kapsamında kişisel verilerimin işlenmesini kabul ediyorum.</label>
              <button class="btn btn--gold btn--block" type="submit">Gönder ${icon("arrow")}</button>
            </form>
          </div>
          <div class="panel panel--dark">
            <h3>Hemen ulaşın</h3>
            <p>Şantiye gezisi için randevu alın ya da sanal tur bağlantısı isteyin.</p>
            <a class="btn btn--gold btn--block" href="https://wa.me/${BI.company.whatsapp}?text=${encodeURIComponent(p.title + " projesi hakkında bilgi almak istiyorum.")}" target="_blank" rel="noopener">${icon("whatsapp")} WhatsApp'tan yaz</a>
            <a class="btn btn--ghost-light btn--block" style="margin-top:.6rem" href="tel:${BI.company.phoneRaw}">${icon("phone")} ${BI.company.phone}</a>
          </div>
        </aside>`;

      // Galeri
      $(".gallery__thumbs").addEventListener("click", e => {
        const b = e.target.closest("button"); if (!b) return;
        $("#mainImg").src = b.dataset.src;
        $$(".gallery__thumbs button").forEach(x => x.classList.toggle("active", x === b));
      });

      // Harita (konuma göre arama gömme)
      const q = encodeURIComponent(p.location.replace("–", "") + " Türkiye");
      $("#map").src = `https://www.google.com/maps?q=${q}&output=embed`;
      $("#mapLink").href = `https://www.google.com/maps/search/?api=1&query=${q}`;

      // Benzer projeler
      $("#related").innerHTML = BI.projects.filter(x => x.id !== p.id && (x.type === p.type || x.location === p.location)).slice(0, 3).map(BI.projectCard).join("");
    };
  </script>
</body>
</html>
